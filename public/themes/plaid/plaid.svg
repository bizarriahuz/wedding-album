<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <defs>
    <pattern id="h" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#6b1e2a"/><rect width="2.6" height="6" fill="#e6d6bb"/>
    </pattern>
    <pattern id="h2" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#5b6146"/><rect width="2.6" height="6" fill="#e6d6bb"/>
    </pattern>
  </defs>
  <rect width="240" height="240" fill="#6b1e2a"/>
  <!-- olive bands -->
  <rect x="0" y="0" width="62" height="240" fill="#6f7652" opacity=".92"/>
  <rect x="0" y="0" width="240" height="62" fill="#6f7652" opacity=".72"/>
  <!-- hatched cream bands -->
  <rect x="128" y="0" width="30" height="240" fill="url(#h)" opacity=".9"/>
  <rect x="0" y="128" width="240" height="30" fill="url(#h)" opacity=".75"/>
  <rect x="128" y="0" width="30" height="62" fill="url(#h2)" opacity=".9"/>
  <rect x="0" y="128" width="62" height="30" fill="url(#h2)" opacity=".75"/>
  <!-- fine cream lines -->
  <rect x="92" y="0" width="3" height="240" fill="#e6d6bb" opacity=".75"/>
  <rect x="0" y="92" width="240" height="3" fill="#e6d6bb" opacity=".6"/>
  <rect x="198" y="0" width="2" height="240" fill="#2e0d12" opacity=".5"/>
  <rect x="0" y="198" width="240" height="2" fill="#2e0d12" opacity=".45"/>
</svg>
