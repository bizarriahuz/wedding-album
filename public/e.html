<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#faf6f0">
  <title>Guest Album</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="guest">
  <main class="wrap">
    <div class="brand">Guest Album</div>
    <div id="cover" class="cover hero hidden"></div>
    <h1 id="title">Loading…</h1>
    <p class="sub" id="subtitle"></p>

    <!-- Shown when the link is broken or the token is missing -->
    <div id="problem" class="card center hidden"></div>

    <!-- Step 1: name -->
    <form id="join" class="card hidden" autocomplete="off">
      <h2>Welcome! What's your name?</h2>
      <input id="name" name="name" maxlength="40" placeholder="e.g. Mak Su, Farah, Amir" required enterkeyhint="go">
      <p class="hint">Your name appears beside the photos you share.</p>
      <button class="full" type="submit">Start sharing</button>
      <div id="join-msg" class="msg" role="status"></div>
    </form>

    <!-- Step 2: share -->
    <section id="share" class="hidden">
      <div class="actions">
        <button type="button" class="action" data-pick="pick-photo">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
          Take photo
        </button>
        <button type="button" class="action" data-pick="pick-video">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10l5-3v10l-5-3z"/></svg>
          Record video
        </button>
      </div>
      <button type="button" class="ghost wide" data-pick="pick-gallery">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg>
        Choose from your gallery
      </button>

      <input id="pick-photo" type="file" accept="image/*" capture="environment" hidden>
      <input id="pick-video" type="file" accept="video/*" capture="environment" hidden>
      <input id="pick-gallery" type="file" accept="image/*,video/*" multiple hidden>

      <div id="status" class="status hidden" role="status" aria-live="polite">
        <div class="status-text"><span id="status-main"></span><span id="status-sub"></span></div>
        <div class="bar"><i id="status-bar"></i></div>
      </div>

      <p class="who">Sharing as <b id="who-name"></b> · <button type="button" class="link-btn" id="change-name">change</button></p>

      <div class="gallery-head">
        <h2>Shared by guests</h2>
        <span id="count" class="muted"></span>
      </div>
      <div id="empty" class="card center muted hidden">No photos yet. Be the first to share one!</div>
      <div id="grid" class="grid"></div>
      <p class="center"><button type="button" class="ghost hidden" id="more">Show older photos</button></p>
    </section>
  </main>

  <!-- Full-screen viewer -->
  <div id="viewer" class="viewer hidden" role="dialog" aria-modal="true" aria-label="Photo viewer">
    <button type="button" class="v-close" id="v-close" aria-label="Close">&times;</button>
    <button type="button" class="v-nav v-prev" id="v-prev" aria-label="Previous">&#8249;</button>
    <div class="v-stage" id="v-stage"></div>
    <button type="button" class="v-nav v-next" id="v-next" aria-label="Next">&#8250;</button>
    <div class="v-caption" id="v-caption"></div>
  </div>

  <div id="toast" class="toast hidden" role="alert"></div>

  <script src="/guest.js"></script>
</body>
</html>
