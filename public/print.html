<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>QR cards · Guest Album</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Figtree:wght@400;500;600&family=Pinyon+Script&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <style id="page-size">@page { size: 210mm 297mm; margin: 0; }</style>
  <style>
    /* ---------- screen chrome (never printed) ---------- */
    body.print { background: #d9dce3; margin: 0; overflow-x: auto; }
    .toolbar {
      position: sticky; top: 0; z-index: 5;
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center;
      padding: 12px 16px; background: #fff; border-bottom: 1px solid var(--line);
      font: 14px var(--sans);
    }
    .toolbar a { padding: 8px 12px; border-radius: 8px; color: var(--ink); text-decoration: none; }
    .toolbar a[aria-current="page"] { background: var(--paper); font-weight: 600; box-shadow: inset 0 0 0 1px var(--line); }
    .toolbar button { margin-left: 8px; }
    .toolbar .tip { flex-basis: 100%; text-align: center; color: var(--ink-soft); font-size: 13px; }
    .pages { display: flex; flex-direction: column; align-items: center; gap: 24px; padding: 24px 12px 60px; }
    .sheet { background: #fff; box-shadow: 0 6px 24px rgba(0, 0, 0, .18); position: relative; overflow: hidden; }
    #error { max-width: 420px; margin: 40px auto; }

    @media print {
      body.print { background: none; }
      .toolbar { display: none; }
      .pages { padding: 0; gap: 0; display: block; }
      .sheet { box-shadow: none; break-after: page; }
      .sheet:last-child { break-after: auto; }
    }

    /* ---------- sizes ---------- */
    .s-a6 { width: 105mm; height: 148mm; }
    .s-a4 { width: 210mm; height: 297mm; }
    .grid4 { display: grid; grid-template-columns: 105mm 105mm; grid-template-rows: 148.5mm 148.5mm; }
    .grid4 .cell { position: relative; display: grid; place-items: center; }
    .grid4 .cell .card6 { transform: scale(.94); }       /* leaves room for home-printer margins */
    .grid4::before, .grid4::after { content: ""; position: absolute; background: none; border: 0 dashed #b9b9b9; pointer-events: none; }
    .grid4::before { left: 50%; top: 0; bottom: 0; border-left-width: .2mm; }
    .grid4::after { top: 50%; left: 0; right: 0; border-top-width: .2mm; }

    /* ---------- shared design (A6 card; poster scales it up) ---------- */
    .card6, .poster {
      position: relative; overflow: hidden;
      display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
      background: var(--p-bg); color: var(--p-ink);
      font-family: var(--sans);
      -webkit-print-color-adjust: exact; print-color-adjust: exact;
    }
    .card6 { width: 105mm; height: 148mm; padding: 0 12mm; }
    .poster { width: 210mm; height: 297mm; padding: 0 26mm; }

    .p-deco, .p-frame { position: absolute; pointer-events: none; }
    .p-frame { display: none; }
    .p-names .nm, .p-names .amp { position: relative; }
    .p-date span { display: block; }
    .p-date span + span { margin-top: .5em; }
    .p-sparkle { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
    .p-sparkle .glint { fill: var(--p-glint); opacity: .9; }
    .p-sparkle .dot { fill: var(--p-glint); opacity: .7; }
    .p-qr { position: relative; z-index: 2; }
    .p-pre, .p-quote, .p-date { position: relative; z-index: 2; }
    .p-names { z-index: 2; }
    .p-names { margin: 0; font-weight: 400; color: var(--p-names); position: relative; isolation: isolate; line-height: 1; }
    .p-quote { color: var(--p-ink); margin: 0; text-wrap: balance; }
    .p-qr { background: #fff; display: grid; place-items: center; }
    .p-qr svg { display: block; width: 100%; height: 100%; }
    .p-how { color: var(--p-soft); margin: 0; }
    .p-date { color: var(--p-ink); margin: 0; letter-spacing: .14em; text-transform: uppercase; }
    .p-pre { margin: 0; letter-spacing: .18em; text-transform: uppercase; color: var(--p-ink); }
    .p-steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; color: var(--p-ink); }
    .p-steps b { display: block; }
    .p-steps li { text-wrap: balance; }

    /* card spacing */
    .card6 .p-pre { font-size: 6.6pt; margin-top: 6mm; }
    .card6 .p-names { font-size: 25pt; margin-top: 2.5mm; padding: 2mm 0; }
    .card6 .p-quote { font-size: 9.4pt; line-height: 1.35; margin-top: 3mm; max-width: 66mm; }
    .card6 .p-qr { width: 46mm; height: 46mm; margin-top: 4.5mm; padding: 2.4mm; border-radius: 2.5mm; }
    .card6 .p-how { font-size: 7pt; line-height: 1.45; margin-top: 3mm; }
    .card6 .p-date { font-size: 6.4pt; margin-top: 5mm; }

    /* poster spacing */
    .poster .p-pre { font-size: 12pt; margin-top: 14mm; }
    .poster .p-names { font-size: 58pt; margin-top: 5mm; padding: 4mm 0; }
    .poster .p-quote { font-size: 19pt; line-height: 1.3; margin-top: 6mm; max-width: 140mm; }
    .poster .p-qr { width: 92mm; height: 92mm; margin-top: 10mm; padding: 5mm; border-radius: 5mm; }
    .poster .p-steps { margin-top: 10mm; width: 150mm; font-size: 10.5pt; line-height: 1.35; gap: 6mm; }
    .poster .p-steps b { font-size: 12.5pt; margin-bottom: 1mm; }
    .poster .p-how { font-size: 10pt; margin-top: 6mm; }
    .poster .p-date { font-size: 10.5pt; margin-top: 4mm; }


    /* ---------- the look: ivory paper, champagne rules, brown ink; flowers sparingly ---------- */
    .theme-ha-florals .card6, .theme-ha-florals .poster {
      --p-bg: #faf8f4; --p-ink: #241c18; --p-soft: #6f645c; --p-names: #241c18; --p-accent: #8c7e6c; --p-glint: #b8aa97;
    }
    .theme-ha-florals .p-frame { display: block; top: 0; height: 100%; width: auto; aspect-ratio: 300 / 975; background: center / contain no-repeat; z-index: 0; }
    .theme-ha-florals .p-frame.left { left: 0; right: auto; background-image: url("/themes/ha-florals/garland-left.webp"); transform: translateX(-44%); }
    .theme-ha-florals .p-frame.right { right: 0; left: auto; background-image: url("/themes/ha-florals/garland-right.webp"); transform: translateX(44%); }
    .theme-ha-florals .p-deco.tl, .theme-ha-florals .p-deco.tr { display: none !important; }
    .theme-ha-florals .p-deco { display: none; background: center / contain no-repeat; }
    .theme-ha-florals .p-deco.tl, .theme-ha-florals .p-deco.tr { display: block; top: -1mm; aspect-ratio: 292 / 331; background-image: url("/themes/ha-florals/corner-top.webp"); }
    .theme-ha-florals .p-deco.tr { transform: scaleX(-1); }
    .theme-ha-florals .p-deco.bl, .theme-ha-florals .p-deco.br { display: block; bottom: -1mm; aspect-ratio: 352 / 585; background-image: url("/themes/ha-florals/corner-bottom.webp"); }
    .theme-ha-florals .p-deco.br { transform: scaleX(-1); }
    .theme-ha-florals .card6 .p-deco.tl, .theme-ha-florals .card6 .p-deco.tr { width: 30mm; }
    .theme-ha-florals .card6 .p-deco.tl { left: -6mm; } .theme-ha-florals .card6 .p-deco.tr { right: -6mm; }
    .theme-ha-florals .card6 .p-deco.bl, .theme-ha-florals .card6 .p-deco.br { width: 22mm; }
    .theme-ha-florals .card6 .p-deco.bl { left: -5mm; } .theme-ha-florals .card6 .p-deco.br { right: -5mm; }
    .theme-ha-florals .poster .p-deco.tl, .theme-ha-florals .poster .p-deco.tr { width: 60mm; }
    .theme-ha-florals .poster .p-deco.tl { left: -10mm; } .theme-ha-florals .poster .p-deco.tr { right: -10mm; }
    .theme-ha-florals .poster .p-deco.bl, .theme-ha-florals .poster .p-deco.br { width: 44mm; }
    .theme-ha-florals .poster .p-deco.bl { left: -9mm; } .theme-ha-florals .poster .p-deco.br { right: -9mm; }
    /* a fine double champagne rule around the page, like stationery */
    .theme-ha-florals .card6::after, .theme-ha-florals .poster::after {
      content: ""; position: absolute; pointer-events: none; z-index: 0;
      border: .3mm solid rgba(140, 126, 108, .55); outline: .2mm solid rgba(140, 126, 108, .35);
    }
    .theme-ha-florals .card6::after { inset: 5mm; outline-offset: 1mm; }
    .theme-ha-florals .poster::after { inset: 9mm; outline-offset: 2mm; border-width: .45mm; }
    .theme-ha-florals .p-pre, .theme-ha-florals .p-date, .theme-ha-florals .p-quote { font-family: "Cormorant Garamond", Georgia, serif; font-variant-numeric: lining-nums; }
    .theme-ha-florals .p-pre, .theme-ha-florals .p-date { font-weight: 600; letter-spacing: .24em; }
    .theme-ha-florals .p-quote { font-style: italic; font-weight: 500; }
    .theme-ha-florals .p-names { font-family: "Pinyon Script", cursive; letter-spacing: 0; }
    .theme-ha-florals .p-names .nm, .theme-ha-florals .p-names .amp { display: block; }
    .theme-ha-florals .p-names .amp { font-size: .8em; line-height: 1.1; padding: 0; color: var(--p-accent); }
    .theme-ha-florals .p-qr { box-shadow: 0 0 0 .3mm rgba(140, 126, 108, .7); border-radius: 1.5mm; }
    .theme-ha-florals .poster .p-qr { box-shadow: 0 0 0 .5mm rgba(140, 126, 108, .7); border-radius: 3mm; }
    .theme-ha-florals .card6 { padding: 0 14mm; }
    .theme-ha-florals .poster { padding: 0 30mm; }
    .theme-ha-florals .card6 .p-pre { font-size: 6pt; margin-top: 0; }
    .theme-ha-florals .card6 .p-names { font-size: 28pt; margin-top: 2mm; padding: 1mm 0; }
    .theme-ha-florals .card6 .p-quote { font-size: 9.5pt; max-width: 62mm; margin-top: 2.5mm; }
    .theme-ha-florals .card6 .p-qr { width: 42mm; height: 42mm; margin-top: 4mm; }
    .theme-ha-florals .card6 .p-date { font-size: 5.8pt; margin-top: 4mm; }
    .theme-ha-florals .poster .p-pre { font-size: 11pt; margin-top: 0; }
    .theme-ha-florals .poster .p-names { font-size: 60pt; margin-top: 4mm; padding: 2mm 0; }
    .theme-ha-florals .poster .p-quote { font-size: 18pt; max-width: 130mm; margin-top: 5mm; }
    .theme-ha-florals .poster .p-qr { width: 88mm; height: 88mm; margin-top: 9mm; }
    .theme-ha-florals .poster .p-date { font-size: 10pt; margin-top: 9mm; }
  </style>
</head>
<body class="print">
  <nav class="toolbar" id="toolbar">
    <a href="#" data-layout="poster">Poster (A4)</a>
    <a href="#" data-layout="card">Table card (A6)</a>
    <button type="button" id="print-btn">Print or save as PDF</button>
    <p class="tip" id="tip"></p>
  </nav>
  <div id="error" class="card center hidden"></div>
  <main class="pages" id="pages"></main>

  <template id="t-card">
    <article class="card6">
      <div class="p-frame left"></div><div class="p-frame right"></div>
      <div class="p-deco tl"></div><div class="p-deco tr"></div>
      <p class="p-pre">The wedding of</p>
      <h1 class="p-names"></h1>
      <p class="p-quote"></p>
      <div class="p-qr"></div>
      <p class="p-date"></p>
      <div class="p-deco bl"></div><div class="p-deco br"></div>
    </article>
  </template>

  <template id="t-poster">
    <article class="poster">
      <div class="p-frame left"></div><div class="p-frame right"></div>
      <div class="p-deco tl"></div><div class="p-deco tr"></div>
      <p class="p-pre">The wedding of</p>
      <h1 class="p-names"></h1>
      <p class="p-quote"></p>
      <div class="p-qr"></div>
      <p class="p-date"></p>
      <div class="p-deco bl"></div><div class="p-deco br"></div>
    </article>
  </template>

  <script src="/vendor/qrcode-generator-1.4.4.js"></script>
  <script>
    const QUOTE = 'Share your moments & wishes with the couple';
    const slug = location.pathname.split('/')[2];
    const token = location.hash.slice(1);
    const params = new URLSearchParams(location.search);
    const layout = params.get('layout') === 'card' ? 'card' : 'poster';
    const $ = (id) => document.getElementById(id);

    const TIPS = {
      card: 'One A6 card per page for the tables. Ask a print shop for A6 on thick card stock (250 gsm or more).',
      poster: 'One A4 poster for the entrance or a standee. Print at 100% (actual size) on thick paper.',
    };

    document.querySelectorAll('[data-layout]').forEach((a) => {
      a.href = `/print/${slug}?layout=${a.dataset.layout}#${token}`;
      if (a.dataset.layout === layout) a.setAttribute('aria-current', 'page');
      a.addEventListener('click', (e) => { e.preventDefault(); location.replace(a.href); location.reload(); });
    });
    $('tip').textContent = TIPS[layout];
    // exact sizes: Chrome doesn't know the A6 keyword
    $('page-size').textContent = `@page { size: ${layout === 'card' ? '105mm 148mm' : '210mm 297mm'}; margin: 0; }`;
    $('print-btn').onclick = () => window.print();

    function qrSvg(text) {
      const qr = qrcode(0, 'Q');
      qr.addData(text);
      qr.make();
      const n = qr.getModuleCount(), q = 2; // 2-module quiet zone inside the white box
      let d = '';
      for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (qr.isDark(r, c)) d += `M${c + q} ${r + q}h1v1h-1z`;
      const color = getComputedStyle(document.documentElement).getPropertyValue('--qr-ink').trim() || '#111';
      return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${n + 2 * q} ${n + 2 * q}" shape-rendering="crispEdges" role="img" aria-label="QR code to the guest album"><path fill="${color}" d="${d}"/></svg>`;
    }

    // Glints: [x, y, size] in a 100 x 141.4 box (A-series proportions). Kept clear of the QR code.
    const GLINTS = [
      [27, 26, 2.6], [73, 29, 1.9], [24, 37, 1.4], [77, 40, 2.4], [31, 45, 1.2], [69, 47, 1.5],
      [21, 60, 1.8], [80, 66, 1.3], [22, 79, 1.1], [79, 84, 2.1], [30, 92, 1.5], [70, 95, 1.2],
    ];
    const DOTS = [[35, 22], [64, 24], [29, 52], [72, 55], [26, 70], [75, 74], [33, 98], [66, 101], [50, 18], [45, 104], [56, 33], [41, 31]];
    function sparkleSvg() {
      const star = (x, y, r) => `<path transform="translate(${x} ${y}) scale(${r})" d="M0-1C.12-.12.12-.12 1 0C.12.12.12.12 0 1C-.12.12-.12.12-1 0C-.12-.12-.12-.12 0-1Z"/>`;
      return `<svg class="p-sparkle" viewBox="0 0 100 141.4" aria-hidden="true">
        <g class="glint">${GLINTS.map(([x, y, r]) => star(x, y, r)).join('')}</g>
        <g class="dot">${DOTS.map(([x, y], i) => `<circle cx="${x}" cy="${y}" r="${i % 3 ? .28 : .42}"/>`).join('')}</g>
      </svg>`;
    }

    function fill(node, ev) {
      const names = node.querySelector('.p-names');
      const parts = ev.couple_names.split(/\s+(?:&|and|dan)\s+/i);
      const span = (text, cls) => { const e = document.createElement('span'); e.textContent = text; if (cls) e.className = cls; return e; };
      if (parts.length === 2) names.append(span(parts[0].trim(), 'nm'), span('&', 'amp'), span(parts[1].trim(), 'nm'));
      else names.append(span(ev.couple_names, 'nm'));
      node.querySelector('.p-quote').textContent = QUOTE;
      const d = new Date(ev.event_date + 'T00:00:00');
      const date = node.querySelector('.p-date');
      date.append(span(d.toLocaleDateString('en-SG', { day: 'numeric', month: 'long', year: 'numeric' })));
      if (ev.venue) date.append(span(ev.venue));
      node.querySelector('.p-qr').innerHTML = qrSvg(ev.guest_url);
      node.insertAdjacentHTML('beforeend', sparkleSvg());
      return node;
    }

    function build(ev) {
      document.documentElement.className = 'theme-ha-florals';
      document.documentElement.style.setProperty('--qr-ink', '#241c18');
      document.title = `QR cards · ${ev.couple_names}`;
      const card = () => fill($('t-card').content.firstElementChild.cloneNode(true), ev);
      const pages = $('pages');
      if (layout === 'card') {
        const s = document.createElement('section'); s.className = 'sheet s-a6'; s.append(card()); pages.append(s);
      } else {
        const s = document.createElement('section'); s.className = 'sheet s-a4';
        s.append(fill($('t-poster').content.firstElementChild.cloneNode(true), ev)); pages.append(s);
      }
      document.fonts.ready.then(() => document.body.dataset.ready = '1');
    }

    function showError(text) {
      $('error').textContent = text;
      $('error').classList.remove('hidden');
      $('toolbar').classList.add('hidden');
    }

    if (!slug || !token) showError('Open this page from the album admin page.');
    else fetch(`/api/admin/${slug}`, { headers: { 'X-Admin-Token': token } })
      .then((r) => r.json().then((d) => (r.ok ? d : Promise.reject(new Error(d.error)))))
      .then(build)
      .catch((e) => showError(e.message || 'Could not load this album.'));
  </script>
</body>
</html>
